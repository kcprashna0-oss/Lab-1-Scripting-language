<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Prime Numbers</title>
</head>
<body>

<script>
let n = parseInt(prompt("Enter a number:"));

for (let i = 1; i <= n; i++) {

    let isPrime = true;

    if (i < 2) {
        isPrime = false;
    }

    for (let j = 2; j < i; j++) {
        if (i % j === 0) {
            isPrime = false;
            break;
        }
    }

    if (isPrime) {
        document.write("<span style='color:red'>" + i + " - Prime</span><br>");
    }
    else if (i % 2 === 0) {
        document.write("<span style='color:green'>" + i + " - Even</span><br>");
    }
    else {
        document.write("<span style='color:blue'>" + i + " - Odd</span><br>");
    }
}
</script>

</body>
</html>
