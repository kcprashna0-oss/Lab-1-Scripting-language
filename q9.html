<!DOCTYPE html>
<html>
<head>
    <title>Larger and Smaller of Three</title>
</head>
<body>

<script>
let num1 = Number(prompt("Enter first integer:"));
let num2 = Number(prompt("Enter second integer:"));
let num3 = Number(prompt("Enter third integer:"));

let largest = Math.max(num1, num2, num3);
let smallest = Math.min(num1, num2, num3);

document.write("Largest number: " + largest + "<br>");
document.write("Smallest number: " + smallest);
</script>

</body>
</html>
