<!DOCTYPE html>
<html>
<head>
    <title>Largest Number in Array</title>
</head>
<body>

<script>
let n = Number(prompt("Enter number of integers:"));
let numbers = [];

for (let i = 0; i < n; i++) {
    numbers[i] = Number(prompt("Enter number " + (i + 1) + ":"));
}

let largest = numbers[0];

for (let i = 1; i < numbers.length; i++) {
    if (numbers[i] > largest) {
        largest = numbers[i];
    }
}

document.write("Array: " + numbers + "<br>");
document.write("Largest number: " + largest);
</script>

</body>
</html>
