<!DOCTYPE html>
<html>
<head>
    <title>Difference Between Dates</title>
</head>
<body>

<script>
function dateDifference(date1, date2) {
    let d1 = new Date(date1);
    let d2 = new Date(date2);

    let difference = Math.abs(d2 - d1);

    return Math.floor(difference / (1000 * 60 * 60 * 24));
}

let date1 = prompt("Enter first date (YYYY-MM-DD):");
let date2 = prompt("Enter second date (YYYY-MM-DD):");

let result = dateDifference(date1, date2);

document.write("Difference between dates: " + result + " days");
</script>

</body>
</html>
