<!DOCTYPE html>
<html>
<head>
    <title>Smallest Number in Array</title>
</head>
<body>

<script>
let n = Number(prompt("Enter number of integers:"));
let numbers = [];

for (let i = 0; i < n; i++) {
    numbers[i] = Number(prompt("Enter number " + (i + 1) + ":"));
}

let smallest = numbers[0];

for (let i = 1; i < numbers.length; i++) {
    if (numbers[i] < smallest) {
        smallest = numbers[i];
    }
}

document.write("Array: " + numbers + "<br>");
document.write("Smallest number: " + smallest);
</script>

</body>
</html>
