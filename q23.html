<!DOCTYPE html>
<html>
<head>
    <title>Remove Characters</title>
</head>
<body>

<script>
function removeCharacters(str, position, number) {
    return str.slice(0, position) + str.slice(position + number);
}

let text = prompt("Enter a string:");
let position = Number(prompt("Enter position to start removing:"));
let number = Number(prompt("Enter number of characters to remove:"));

let result = removeCharacters(text, position, number);

document.write("Original String: " + text + "<br>");
document.write("Result: " + result);
</script>

</body>
</html>
