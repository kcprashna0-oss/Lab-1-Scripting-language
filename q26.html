<!DOCTYPE html>
<html>
<head>
    <title>Ten Most Frequent Words</title>
</head>
<body>

    <h2>Find Ten Most Frequent Words</h2> 

    <script>
        function tenMostFrequentWords(text) {
          
            let words = text.toLowerCase().match(/\b[a-z]+\b/g);

            if (!words) {
                return [];
            }

            
            let frequency = {};

            words.forEach(function(word) {
                if (frequency[word]) {
                    frequency[word]++;
                } else {
                    frequency[word] = 1;
                }
            });

        
            let result = Object.entries(frequency);

            
            result.sort(function(a, b) {
                return b[1] - a[1];
            });

            return result.slice(0, 10);
        }

    
        let text = prompt("Enter a string:");

        
        let result = tenMostFrequentWords(text);

      
        document.write("<h3>Ten Most Frequent Words:</h3>");

        result.forEach(function(item) {
            document.write(item[0] + " : " + item[1] + " times<br>");
        });
    </script>

</body>
</html>
