<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Button Events</title>

    <style>
        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h2>JavaScript Button Events</h2>

    <p id="para">This is a paragraph.</p>

    <button onclick="changeText()">Change Text</button>
    <button onclick="changeColor()">Change Color</button>
    <button onclick="changeSize()">Change Size</button>
    <button onclick="hidePara()">Hide Paragraph</button>
    <button onclick="showPara()">Show Paragraph</button>
    <button onclick="resetPara()">Reset</button>

    <script>
        function changeText() {
            document.getElementById("para").innerHTML =
                "The paragraph text has been changed!";
        }

        function changeColor() {
            document.getElementById("para").style.color = "red";
        }

        function changeSize() {
            document.getElementById("para").style.fontSize = "30px";
        }

        function hidePara() {
            document.getElementById("para").style.display = "none";
        }

        function showPara() {
            document.getElementById("para").style.display = "block";
        }

        function resetPara() {
            let p = document.getElementById("para");

            p.innerHTML = "This is a paragraph.";
            p.style.color = "black";
            p.style.fontSize = "20px";
            p.style.display = "block";
        }
    </script>

</body>
</html>
