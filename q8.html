<!DOCTYPE html>
<html>
<head>
    <title>Larger and Smaller</title>
</head>
<body>

<script>
let num1 = Number(prompt("Enter first integer:"));
let num2 = Number(prompt("Enter second integer:"));

if (num1 > num2) {
    document.write("Larger number: " + num1 + "<br>");
    document.write("Smaller number: " + num2);
}
else if (num2 > num1) {
    document.write("Larger number: " + num2 + "<br>");
    document.write("Smaller number: " + num1);
}
else {
    document.write("Both numbers are equal.");
}
</script>

</body>
</html>
